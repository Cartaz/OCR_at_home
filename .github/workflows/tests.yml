name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libfontconfig1 \
            libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt pip-audit pyflakes

      - name: Known vulnerabilities in runtime dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Python syntax and unused code
        run: |
          python -m compileall -q main.py config core ui tests benchmarks
          python -m pyflakes main.py config core ui tests

      - name: Shell/package syntax
        run: |
          bash -n install.sh
          bash -n PKGBUILD

      - name: Tests
        run: python -m pytest -q
