    steps:
      - uses: actions/checkout@v4
        with:
          ref: benchmark-production-profile-resource-guard

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply strategic milestone update
        shell: bash
        run: |
          printf '%s' "$PATCH_B64" | tr -d '\n' | base64 -d | gzip -d > /tmp/apply_milestone_update.py
          python /tmp/apply_milestone_update.py --repo . --no-tests
          python -m compileall -q config core tests/benchmark tests/test_core
          git diff --check

      - name: Commit generated source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config core tests
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Apply benchmark-selected profile and resource guard"
          git push origin HEAD:benchmark-production-profile-resource-guard
