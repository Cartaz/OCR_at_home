name: Temporary benchmark memory patch

on:
  push:
    branches:
      - benchmark-memory-isolation

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Apply benchmark memory isolation runner patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: benchmark-memory-isolation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic runner patch
        run: python scripts/_apply_memory_isolation_runner.py
      - name: Compile touched benchmark files
        run: >-
          python -m compileall -q
          tests/benchmark/run_realworld_suite_v2.py
          tests/benchmark/runtime_backend.py
          tests/benchmark/memory_guard.py
      - name: Commit generated runner
        run: |
          if git diff --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/benchmark/run_realworld_suite_v2.py
          git commit -m 'Apply benchmark memory isolation runner patch'
          git push origin HEAD:benchmark-memory-isolation
