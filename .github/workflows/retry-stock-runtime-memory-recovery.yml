name: retry stock runtime and memory recovery

on:
  push:
    branches: [stock-runtime-memory-recovery]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stock-runtime-memory-recovery

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Reuse and execute canonical one-shot patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/apply-stock-runtime-memory-recovery.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          name_index = next(
              i for i, line in enumerate(lines)
              if line.strip() == '- name: Apply strategic runtime and memory changes'
          )
          run_index = next(
              i for i in range(name_index + 1, len(lines))
              if lines[i].strip() == 'run: |'
          )
          body: list[str] = []
          for line in lines[run_index + 1:]:
              if line.startswith('      - name:'):
                  break
              body.append(line[10:] if line.startswith('          ') else line)
          script = Path('/tmp/apply-stock-runtime-memory-recovery.sh')
          script.write_text('\n'.join(body) + '\n', encoding='utf-8')
          PY
          bash /tmp/apply-stock-runtime-memory-recovery.sh

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config core tests
          git commit -m "Restore stock llama runtime and enforce memory recovery"
          git push origin HEAD:stock-runtime-memory-recovery
