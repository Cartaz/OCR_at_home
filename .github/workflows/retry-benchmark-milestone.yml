name: retry benchmark milestone update

on:
  push:
    branches: [benchmark-production-profile-resource-guard]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: benchmark-production-profile-resource-guard

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recover and apply milestone patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/apply-benchmark-milestone.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          for index, line in enumerate(lines):
              if 'PATCH_B64: |' in line:
                  start = index
                  base_indent = len(line) - len(line.lstrip())
                  break
          else:
              raise SystemExit('PATCH_B64 block not found')

          parts = []
          for line in lines[start + 1:]:
              indent = len(line) - len(line.lstrip())
              if line.strip() and indent <= base_indent:
                  break
              if line.strip():
                  parts.append(line.strip())
          Path('/tmp/patch.b64').write_text(''.join(parts), encoding='ascii')
          PY
          base64 -d /tmp/patch.b64 | gzip -d > /tmp/apply_milestone_update.py
          python /tmp/apply_milestone_update.py --repo . --no-tests
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_core/test_llama_backend.py')
          path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
          python -m compileall -q config core tests/benchmark tests/test_core
          git diff --check

      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config core tests
          git commit -m "Apply benchmark-selected profile and resource guard"
          git push origin HEAD:benchmark-production-profile-resource-guard
