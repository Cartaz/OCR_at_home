name: finalize stock runtime memory recovery v2

on:
  push:
    branches: [stock-runtime-memory-recovery]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stock-runtime-memory-recovery

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Apply reviewed cleanup and test expectations
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"{path}: marker not found: {old[:160]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "tests/benchmark/runtime_backend.py",
              '''"""Benchmark-only llama-server runtime tuning.\n\nThis module reuses the production SYCL runtime/model discovery and owned-process\nlifecycle while allowing the canonical hardware benchmark to vary inference\nflags around the production profile defined in ``config.constants``.\n"""''',
              '''"""Benchmark-only llama-server runtime tuning.\n\nThis module reuses the production SYCL runtime/model discovery and owned-process\nlifecycle while allowing the canonical hardware benchmark to vary inference\nflags around a stock llama.cpp baseline. A ``None`` runtime field means the\ncorresponding CLI flag is omitted and llama.cpp keeps its native default.\n"""''',
          )
          replace_once(
              "tests/benchmark/runtime_backend.py",
              "from config.constants import AppConstants, AppMeta\n",
              "from config.constants import AppMeta\n",
          )
          replace_once(
              "tests/benchmark/runtime_backend.py",
              "        r = self.resolved()\n        def value(item: object) -> str:\n",
              "        r = self.resolved()\n\n        def value(item: object) -> str:\n",
          )

          replace_once(
              "tests/benchmark/memory_guard.py",
              "MEMORY_PRESSURE_FLOOR_MIB = 1024.0",
              "MEMORY_PRESSURE_FLOOR_MIB = 2048.0",
          )
          replace_once(
              "tests/benchmark/REALWORLD.md",
              "hard safety floor of **1024 MiB MemAvailable**",
              "hard safety floor of **2048 MiB MemAvailable**",
          )

          replace_once(
              "tests/benchmark/test_canonical_policy.py",
              '''    assert baseline.runtime.context_size == 16384\n    assert runner.CHECKPOINT_SCHEMA == canonical_policy.CHECKPOINT_SCHEMA == 6\n''',
              '''    assert baseline.runtime.context_size is None\n    assert baseline.runtime.cli_args() == []\n    assert runner.CHECKPOINT_SCHEMA == canonical_policy.CHECKPOINT_SCHEMA == 7\n''',
          )

          context_test = Path("tests/benchmark/test_context_baseline_guard.py")
          context_test.write_text('''"""Regression tests for the canonical real-world benchmark baseline guards."""\n\nfrom __future__ import annotations\n\nfrom tests.benchmark.runtime_backend import (\n    RuntimeCapabilities,\n    ServerRuntimeConfig,\n    production_runtime_config,\n    runtime_stage_a_values,\n)\n\n\ndef test_realworld_baseline_is_stock_without_removing_context_candidates() -> None:\n    baseline = production_runtime_config()\n    assert baseline.context_size is None\n    assert baseline.cli_args() == []\n\n    capabilities = RuntimeCapabilities(\n        server_path="/tmp/llama-server",\n        version="test",\n        supported={"context_size": True},\n    )\n    assert runtime_stage_a_values(capabilities)["context_size"] == [\n        2048,\n        3072,\n        4096,\n        6144,\n        8192,\n        12288,\n        16384,\n    ]\n\n    assert ServerRuntimeConfig().context_size is None\n\n\ndef test_canonical_entrypoint_uses_stock_baseline_checkpoint_schema() -> None:\n    from tests.benchmark import run_realworld_suite  # noqa: F401\n    from tests.benchmark import run_realworld_suite_v2 as runner\n\n    assert runner.CHECKPOINT_SCHEMA == 7\n''', encoding="utf-8")

          replace_once(
              "tests/test_core/test_benchmark_resource_limits.py",
              '''            _snapshot(1200.0, monotonic_s=0.0),\n            _snapshot(200.0, monotonic_s=0.1),\n            _snapshot(180.0, monotonic_s=0.2),\n''',
              '''            _snapshot(3000.0, monotonic_s=0.0),\n            _snapshot(1500.0, monotonic_s=0.1),\n            _snapshot(1400.0, monotonic_s=0.2),\n''',
          )
          replace_once(
              "tests/test_core/test_benchmark_resource_limits.py",
              '''    assert critical == [200.0]\n    assert metrics["pressure_triggered"] is True\n    assert metrics["critical_available_mib"] == MEMORY_PRESSURE_FLOOR_MIB\n    assert metrics["pressure_snapshot"]["mem_available_mib"] == 200.0\n''',
              '''    assert critical == [1500.0]\n    assert metrics["pressure_triggered"] is True\n    assert metrics["critical_available_mib"] == MEMORY_PRESSURE_FLOOR_MIB\n    assert metrics["pressure_snapshot"]["mem_available_mib"] == 1500.0\n''',
          )
          replace_once(
              "tests/test_core/test_benchmark_runtime_recovery.py",
              '        metrics={"memory": {"mem_available_min_mib": 2048.0}},\n',
              '        metrics={"memory": {"mem_available_min_mib": 4096.0}},\n',
          )

          shutdown = Path("tests/test_ui/test_shutdown_lifecycle.py")
          text = shutdown.read_text(encoding="utf-8")
          old = '''def test_owned_llama_server_is_terminated_as_a_process_group() -> None:\n    backend = (ROOT / "core" / "llama_backend.py").read_text(encoding="utf-8")\n\n    assert 'start_new_session=(os.name == "posix")' in backend\n    assert "os.killpg(process.pid, signal.SIGTERM)" in backend\n    assert "process.wait(timeout=5)" in backend\n    assert "os.killpg(process.pid, signal.SIGKILL)" in backend\n    assert "process.wait(timeout=3)" in backend\n    assert "def shutdown(self) -> None:" in backend\n    assert "self._stop_server()" in backend.split("def shutdown(self) -> None:", 1)[1]\n'''
          new = '''def test_owned_llama_server_is_terminated_as_a_process_group() -> None:\n    backend = (ROOT / "core" / "llama_backend.py").read_text(encoding="utf-8")\n    owned = (ROOT / "core" / "owned_process.py").read_text(encoding="utf-8")\n    exec_shim = (ROOT / "core" / "owned_process_exec.py").read_text(encoding="utf-8")\n\n    assert "spawn_owned_process" in backend\n    assert 'start_new_session=(os.name == "posix")' in owned\n    assert "PR_SET_PDEATHSIG" in exec_shim\n    assert "signal.SIGKILL" in exec_shim\n    assert "os.killpg(process_group_id, signal.SIGTERM)" in backend\n    assert "process.wait(timeout=5)" in backend\n    assert "os.killpg(process_group_id, signal.SIGKILL)" in backend\n    assert "process.wait(timeout=3)" in backend\n    assert "def shutdown(self) -> None:" in backend\n    assert "self._stop_server()" in backend.split("def shutdown(self) -> None:", 1)[1]\n'''
          if old not in text:
              raise SystemExit("shutdown lifecycle marker not found")
          shutdown.write_text(text.replace(old, new, 1), encoding="utf-8")

          Path("tests/test_core/test_owned_process.py").write_text('''"""Linux integration tests for owned subprocess lifetime."""\n\nfrom __future__ import annotations\n\nimport os\nimport signal\nimport subprocess\nimport sys\nimport time\nfrom pathlib import Path\n\nimport pytest\n\n\ndef _process_is_running(pid: int) -> bool:\n    status = Path(f"/proc/{pid}/stat")\n    try:\n        fields = status.read_text(encoding="utf-8").split()\n    except OSError:\n        return False\n    return len(fields) > 2 and fields[2] != "Z"\n\n\n@pytest.mark.skipif(\n    os.name != "posix" or not sys.platform.startswith("linux"),\n    reason="PR_SET_PDEATHSIG is Linux-specific",\n)\ndef test_owned_child_dies_when_owner_is_sigkilled(tmp_path: Path) -> None:\n    pid_file = tmp_path / "owned-child.pid"\n    child_code = (\n        "import os,time; from pathlib import Path; "\n        f"Path({str(pid_file)!r}).write_text(str(os.getpid()), encoding='utf-8'); "\n        "time.sleep(30)"\n    )\n    owner_code = f"""\nimport os\nimport sys\nimport time\nfrom core.owned_process import spawn_owned_process\n\nwith open(os.devnull, \"w\", encoding=\"utf-8\") as log:\n    spawn_owned_process(\n        [sys.executable, \"-c\", {child_code!r}],\n        stdout=log,\n        env=os.environ,\n    )\n    time.sleep(30)\n"""\n    owner = subprocess.Popen([sys.executable, "-c", owner_code])\n    child_pid: int | None = None\n    try:\n        deadline = time.monotonic() + 5.0\n        while time.monotonic() < deadline:\n            if pid_file.exists():\n                child_pid = int(pid_file.read_text(encoding="utf-8"))\n                break\n            if owner.poll() is not None:\n                pytest.fail(f"owner exited before child startup: {owner.returncode}")\n            time.sleep(0.05)\n        assert child_pid is not None, "owned child did not start"\n        assert _process_is_running(child_pid)\n\n        owner.send_signal(signal.SIGKILL)\n        owner.wait(timeout=3)\n\n        deadline = time.monotonic() + 5.0\n        while time.monotonic() < deadline and _process_is_running(child_pid):\n            time.sleep(0.05)\n        assert not _process_is_running(child_pid), (\n            "owned child survived an unexpected owner SIGKILL"\n        )\n    finally:\n        if owner.poll() is None:\n            owner.kill()\n            owner.wait(timeout=3)\n        if child_pid is not None and _process_is_running(child_pid):\n            os.kill(child_pid, signal.SIGKILL)\n''', encoding="utf-8")
          PY

          python -m compileall -q main.py config core ui tests
          bash -n install.sh
          bash -n PKGBUILD
          python -m pytest -q
          git diff --check

      - name: Commit validated changes
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          git commit -m "Validate stock runtime ownership and memory recovery"
          git push origin HEAD:stock-runtime-memory-recovery
